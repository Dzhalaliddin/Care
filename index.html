я только гость, который вообще не дозвонился<\/b>: его звонок не принят, он ждал 30 секунд и больше, потом не дозвонился сам ни разу в течение 24 часов, и оператор ему не перезвонил (после перезвона вся серия его звонков не считается: 3 звонка и 1 перезвон — пропущенных 0). Неважно, ответил ли гость на перезвон: главное, что оператор перезвонил или гость позвонил сам повторно. <b>Доля пропущенных = такие звонки / входящие в рабочие часы.<\/b><\/div>\n<div class=\"kpi\" id=\"kpi\"><\/div>\n<div class=\"g\"><div class=\"c\"><h2>Как получилась цифра<\/h2><table id=\"fn\"><\/table><\/div>\n<div class=\"c\"><h2>Что ещё важно<\/h2><table id=\"ex\"><\/table><\/div><\/div>\n<div class=\"g\"><div class=\"c w\"><h2>Звонки по городам (добавочный: 1 Алматы, 2 Астана, 3 Шымкент, 4 Туркестан)<\/h2><table id=\"ct\"><\/table><p class=\"note\">Доля — от всех входящих. «В рабочие часы» — звонки 10:00–22:00 с выбранным городом. % — пропущенные от них. «Город не выбран» — звонки без добавочного, в расчёт не входят. Исходящие звонки операторов (636) города не имеют.<\/p><\/div><\/div>\n<div class=\"g\"><div class=\"c w\"><h2>Пропущенные по дням (число и % от входящих за день в рабочие часы)<\/h2><div class=\"col\" id=\"dy\"><\/div><\/div>\n<div class=\"c w\"><h2>Пропущенные по часам (число и % от входящих в этот час)<\/h2><div class=\"col\" id=\"hr\" style=\"height:130px\"><\/div><\/div><\/div>\n<div class=\"g\"><div class=\"c w\"><h2>Операторы<\/h2><table id=\"op\"><\/table><p class=\"note\">Ожидание — сколько гость ждал до ответа оператора. Перезвоны — исходящие звонки оператора, из них с ответом гостя.<\/p><\/div>\n<div class=\"c w\"><h2 id=\"lt\"><\/h2><div class=\"sc\"><table id=\"ls\"><\/table><\/div><p class=\"note\">Номера скрыты частично. В списке только звонки, на которые оператор не перезвонил в течение 24 часов.<\/p><\/div><\/div>\n<div class=\"g\"><div class=\"c w\"><h2>Отчёты Ringostat по пропущенным<\/h2><div id=\"rp\"><\/div><\/div><\/div>\n<script>\nconst R={\"F\":{\"to
